
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243047;
        }

        header {
            background: #123b65;
            color: white;
            padding: 24px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 7px 0 0;
            color: #dce9f7;
        }

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px #16395b12;
        }

        .card p {
            color: #66758a;
            margin: 0 0 12px;
        }

        .card h2 {
            font-size: 32px;
            margin: 0;
            color: #123b65;
        }

        .appointments {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px #16395b12;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .toolbar h2 {
            margin: 0;
        }

        button {
            background: #147d92;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 17px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #106477;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e8edf3;
        }

        th {
            background: #f7f9fc;
            color: #526178;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        #message {
            margin: 15px 0;
            color: #526178;
        }

        .error {
            color: #b42318 !important;
        }

        @media (max-width: 600px) {
            main {
                margin-top: 20px;
                padding: 0 12px;
            }

            .appointments {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<header>
    <div>
        <h1>Doctor Admin Dashboard</h1>
        <p>Appointment management</p>
    </div>

    <button onclick="loadAppointments()">Refresh Appointments</button>
</header>

<main>
    <section class="summary">
        <div class="card">
            <p>Total Appointments</p>
            <h2 id="totalCount">—</h2>
        </div>

        <div class="card">
            <p>Today's Appointments</p>
            <h2 id="todayCount">—</h2>
        </div>
    </section>

    <section class="appointments">
        <div class="toolbar">
            <h2>All Appointments</h2>
        </div>

        <p id="message">Loading appointments...</p>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th>
                </tr>
                </thead>

                <tbody id="appointmentRows"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    async function loadAppointments() {
        const message = document.getElementById("message");
        const rows = document.getElementById("appointmentRows");

        message.textContent = "Loading appointments...";
        message.classList.remove("error");
        rows.replaceChildren();

        try {
            const response = await fetch("/api/appointments", {
                headers: {
                    "Accept": "application/json"
                },
                credentials: "same-origin"
            });

            if (response.status === 401 || response.status === 403) {
                throw new Error(
                    "Admin access is required. Sign in with your admin credentials, then refresh this page."
                );
            }

            if (!response.ok) {
                throw new Error("Could not load appointments. HTTP " + response.status);
            }

            const appointments = await response.json();
            const today = new Date().toLocaleDateString("en-CA");

            document.getElementById("totalCount").textContent =
                appointments.length;

            document.getElementById("todayCount").textContent =
                appointments.filter(a =>
                    String(a.appointmentDate).slice(0, 10) === today
                ).length;

            if (appointments.length === 0) {
                message.textContent = "No appointments found yet.";
                return;
            }

            for (const a of appointments) {
                const tr = document.createElement("tr");

                const values = [
                    a.id,
                    a.patientName,
                    a.phone,
                    a.email,
                    a.service,
                    a.appointmentDate,
                    a.appointmentTime
                ];

                for (const value of values) {
                    const td = document.createElement("td");
                    td.textContent = value == null ? "—" : String(value);
                    tr.appendChild(td);
                }

                rows.appendChild(tr);
            }

            message.textContent =
                "Loaded " + appointments.length + " appointment(s).";

        } catch (error) {
            message.textContent = error.message;
            message.classList.add("error");
            document.getElementById("totalCount").textContent = "—";
            document.getElementById("todayCount").textContent = "—";
        }
    }

    loadAppointments();
</script>
</body>
</html>
